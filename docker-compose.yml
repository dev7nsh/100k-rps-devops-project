services:
  # ───────────────────────────────────────────────────────────
  #  PostgreSQL 16 — tuned for high-concurrency benchmarking
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: benchmark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark_secret
      # Performance-critical runtime params applied at startup
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      # ─── Memory ───────────────────────────────────────────
      - -c
      - shared_buffers=512MB          # 25% of total RAM (2 GB assumed)
      - -c
      - effective_cache_size=1536MB   # 75% of RAM
      - -c
      - work_mem=8MB                  # per sort/hash — keep low for many connections
      - -c
      - maintenance_work_mem=256MB    # VACUUM, CREATE INDEX
      # ─── WAL / Checkpoints ────────────────────────────────
      - -c
      - wal_level=minimal
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=off        # HUGE read-heavy benchmark win; safe for our data
      # ─── Connections ──────────────────────────────────────
      - -c
      - max_connections=500           # supports many Node workers × pool size
      # ─── Planner ──────────────────────────────────────────
      - -c
      - random_page_cost=1.1          # SSD — planner prefers index scans
      - -c
      - effective_io_concurrency=200  # SSD concurrent I/O
      # ─── Logging (minimal for benchmarks) ─────────────────
      - -c
      - log_min_duration_statement=1000   # log queries > 1 s
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bench_net

  # ───────────────────────────────────────────────────────────
  #  pgAdmin 4 — optional GUI (comment out if not needed)
  # ───────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: benchmark_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bench.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bench_net
    profiles:
      - tools          # only starts with: docker compose --profile tools up

  # ───────────────────────────────────────────────────────────
  #  Prometheus — metrics scraping (Grafana-ready)
  # ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: benchmark_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - bench_net
    profiles:
      - monitoring

  # ───────────────────────────────────────────────────────────
  #  Grafana — dashboards
  # ───────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: benchmark_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - bench_net
    profiles:
      - monitoring

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  bench_net:
    driver: bridge
