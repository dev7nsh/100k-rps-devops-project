# ─────────────────────────────────────────────────────────────
#  nginx.conf — production-ready reverse proxy
#
#  Demonstrates:
#  • Upstream load balancing across multiple Node workers
#  • Keep-alive connections from Nginx → Node (critical for high RPS)
#  • Gzip compression for JSON responses
#  • Rate limiting (commented — enable to protect the server)
#  • Logging in a Prometheus-friendly format
#
#  Usage (not in docker-compose.yml by default):
#    docker run --network=host -v ./nginx.conf:/etc/nginx/nginx.conf nginx:alpine
# ─────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Increase file descriptor limit for high concurrency
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;              # Linux kernel I/O event notification
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # ── Access log (JSON for log aggregators) ──────────────────
    log_format json_log escape=json
        '{"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"duration_ms":$request_time,'
        '"bytes_sent":$bytes_sent,'
        '"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time",'
        '"remote":"$remote_addr"}';

    access_log /var/log/nginx/access.log json_log;

    # ── Timeout tuning ─────────────────────────────────────────
    keepalive_timeout          65;
    keepalive_requests         10000;  # requests before closing upstream conn
    client_body_timeout        10;
    client_header_timeout      10;
    send_timeout               30;
    proxy_connect_timeout      5;
    proxy_send_timeout         10;
    proxy_read_timeout         30;

    # ── Buffer tuning ──────────────────────────────────────────
    client_body_buffer_size    16k;
    client_max_body_size       1m;
    proxy_buffering            on;
    proxy_buffer_size          16k;
    proxy_buffers              4 16k;

    # ── Gzip compression ───────────────────────────────────────
    gzip on;
    gzip_comp_level  4;
    gzip_types       application/json text/plain;
    gzip_min_length  1024;
    gzip_vary        on;

    # ── Rate limiting (disabled; uncomment to enable) ──────────
    # limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/s;

    # ── Upstream — Node.js workers ─────────────────────────────
    # Add one server line per Node.js instance (PM2 worker or container).
    # With PM2 cluster on port 3000, all workers share the same port
    # via the OS TCP stack — so a single upstream entry is enough.
    # For multi-server deployments, list each server's IP here.
    upstream node_backend {
        # Zone declares shared memory for health-check state
        # (requires nginx-plus or openresty; comment out for OSS nginx)
        # zone backend 64k;

        server 127.0.0.1:3000;
        # server 127.0.0.1:3001;  # ← add for multi-port PM2 or Docker replicas
        # server 10.0.0.2:3000;   # ← add for multi-server deployments

        # Keep-alive pool to Node — CRITICAL for throughput
        # Without this Nginx opens a new TCP connection per request.
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        # ── Proxy settings ─────────────────────────────────────
        proxy_http_version      1.1;
        proxy_set_header        Connection "";          # enable keep-alive
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # ── API routes ─────────────────────────────────────────
        location / {
            # limit_req zone=api burst=2000 nodelay;  # uncomment to enable rate limiting
            proxy_pass http://node_backend;
        }

        # ── Static health check (Nginx itself, no Node hit) ────
        location /nginx-health {
            access_log off;
            return 200 '{"status":"ok"}';
        }
    }
}
